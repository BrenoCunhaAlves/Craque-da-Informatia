<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Craque da Informática</title>
<style>
:root{--grama:#1f7a3a;--grama2:#2a8c47;--tinta:#0e2238;--amarelo:#ffd23f;--vermelho:#b00020;--ok:#0b6b2e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Verdana,"Trebuchet MS",sans-serif;color:var(--tinta);
background:repeating-linear-gradient(90deg,var(--grama) 0 90px,var(--grama2) 90px 180px);
display:flex;flex-direction:column;align-items:center;padding:16px;gap:14px}
header{width:100%;max-width:820px;background:var(--tinta);color:#fff;border-radius:14px;padding:12px 18px;
display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
h1{margin:0;font-size:1.5rem}
.placar{display:flex;gap:18px;font-size:1.15rem}
.placar b{background:var(--amarelo);color:var(--tinta);padding:2px 10px;border-radius:8px}
main{width:100%;max-width:820px;background:#fff;border:4px solid var(--tinta);border-radius:18px;padding:22px;font-size:1.25rem;line-height:1.5;outline:none}
h2{margin-top:0;font-size:1.6rem}
.btn{min-height:56px;padding:10px 22px;font:inherit;font-weight:700;background:var(--amarelo);color:var(--tinta);
border:3px solid var(--tinta);border-radius:12px;cursor:pointer;margin:6px 8px 6px 0}
.btn:hover{background:#ffe27a}
.btn:focus-visible,.bola:focus-visible,.ent:focus-visible{outline:5px solid #1d4ed8;outline-offset:3px}
.btn.sel{background:var(--tinta);color:#fff}
.btn:disabled{opacity:.55;cursor:default}
.gramado{position:relative;height:260px;background:var(--grama2);border:3px solid #fff;border-radius:12px;margin:12px 0}
.bola{position:absolute;width:84px;height:84px;font-size:3rem;line-height:1;border-radius:50%;border:3px solid var(--tinta);background:#fff;cursor:pointer}
.palavra{font-size:3rem;font-weight:700;letter-spacing:.15em;text-align:center;margin:8px 0}
.ent{width:100%;font:inherit;font-size:2rem;text-transform:uppercase;text-align:center;padding:10px;border:3px solid var(--tinta);border-radius:12px;margin-bottom:8px}
.lista{display:flex;flex-wrap:wrap;margin:8px 0}
.prog{font-size:1.05rem;color:#334155}
.pergunta{font-weight:700}
.placar-final{font-size:2rem;font-weight:700}
#aviso{width:100%;max-width:820px;margin:0;min-height:3.2rem;padding:10px 16px;border-radius:12px;background:#fff;font-size:1.15rem;font-weight:700}
#aviso.ok{color:var(--ok)}#aviso.erro{color:var(--vermelho)}
#aviso:empty{visibility:hidden}
.sr{position:absolute;left:-9999px}
@media (max-width:560px){h1{font-size:1.2rem}main{padding:14px;font-size:1.1rem}.palavra{font-size:2.2rem}}
</style>
</head>
<body>
<header>
  <h1>Craque da Informática</h1>
  <div class="placar" role="status" aria-live="polite">
    <span>Gols <b id="gols">0</b></span>
    <span>Jogada <b id="fase">0</b> de 4</span>
  </div>
</header>
<main id="campo" tabindex="-1"><noscript>Ative o JavaScript do navegador para jogar.</noscript></main>
<p id="aviso" role="status" aria-live="polite"></p>

<script>
const $ = s => document.querySelector(s);
const campo = $('#campo'), aviso = $('#aviso');
const TOTAL = 18; // 5 (mouse) + 5 (teclado) + 5 (pastas) + 3 (segurança)
let gols = 0;

function setGols(n){ gols = n; $('#gols').textContent = n; }
function setFase(n){ $('#fase').textContent = n; }
function msg(t, ok){ aviso.textContent = t; aviso.className = ok ? 'ok' : 'erro'; }
function tela(h){ campo.innerHTML = h; campo.focus(); }
function botao(texto, classe, aoClicar){
  const b = document.createElement('button');
  b.className = classe; b.textContent = texto; b.onclick = aoClicar; return b;
}

function inicio(){
  setGols(0); setFase(0); msg('', true);
  tela(`<h2>Bem-vindo ao jogo!</h2>
  <p>Você é o craque do time. Em 4 jogadas, vai treinar mouse, teclado, pastas e segurança na internet.
  Cada acerto vale um gol. Não tem pressa e você pode errar à vontade.</p>
  <button class="btn" id="go">Começar a partida</button>`);
  $('#go').onclick = f1;
}

/* Jogada 1: mouse */
function f1(){
  setFase(1); msg('', true);
  let n = 0;
  tela(`<h2>Jogada 1: Mouse</h2>
  <p>Clique na bola para chutar a gol. Faça 5 gols.</p>
  <div class="gramado" id="gr"><button class="bola" id="bola" aria-label="Bola de futebol. Clique para chutar.">⚽</button></div>
  <p class="prog" id="prog">Gols nesta jogada: 0 de 5</p>`);
  const b = $('#bola'), g = $('#gr');
  const mover = () => {
    b.style.left = Math.random() * (g.clientWidth - 90) + 'px';
    b.style.top = Math.random() * (g.clientHeight - 90) + 'px';
  };
  mover();
  b.onclick = () => {
    n++; setGols(gols + 1);
    $('#prog').textContent = `Gols nesta jogada: ${n} de 5`;
    msg('Gol! Muito bem!', true);
    if (n >= 5) setTimeout(f2, 700); else mover();
  };
}

/* Jogada 2: teclado */
const palavras = ['GOL', 'BOLA', 'TIME', 'CAMPO', 'TORCIDA'];
function f2(){
  setFase(2); msg('', true);
  let i = 0;
  tela(`<h2>Jogada 2: Teclado</h2>
  <p>Digite a palavra que aparece e aperte Enter.</p>
  <p class="palavra" id="pal"></p>
  <label for="ent" class="sr">Digite a palavra aqui</label>
  <input id="ent" class="ent" autocomplete="off" autocapitalize="characters" spellcheck="false">
  <button class="btn" id="ok">Chutar</button>
  <p class="prog" id="prog"></p>`);
  const ent = $('#ent');
  const mostrar = () => {
    $('#pal').textContent = palavras[i];
    $('#prog').textContent = `Palavra ${i + 1} de ${palavras.length}`;
    ent.value = ''; ent.focus();
  };
  const checar = () => {
    if (ent.value.trim().toUpperCase() === palavras[i]) {
      setGols(gols + 1); msg('Gol! Palavra certa!', true); i++;
      if (i >= palavras.length) setTimeout(f3, 700); else mostrar();
    } else msg('Quase! Confira as letras e tente de novo.', false);
  };
  $('#ok').onclick = checar;
  ent.onkeydown = e => { if (e.key === 'Enter') checar(); };
  mostrar();
}

/* Jogada 3: pastas e arquivos */
const arquivos = [
  ['escalacao.docx', 'Documentos'], ['foto-do-gol.png', 'Imagens'],
  ['hino-do-time.mp3', 'Músicas'], ['regras-do-jogo.pdf', 'Documentos'],
  ['camisa-nova.jpg', 'Imagens']
];
function f3(){
  setFase(3); msg('', true);
  let sel = null, restam = arquivos.slice();
  const desenhar = () => {
    tela(`<h2>Jogada 3: Pastas e arquivos</h2>
    <p>Clique em um arquivo e depois na pasta onde ele deve ficar.</p>
    <div class="lista" id="arq"></div><div class="lista" id="pas"></div>
    <p class="prog">Arquivos para guardar: ${restam.length}</p>`);
    restam.forEach(a => {
      const b = botao('📄 ' + a[0], 'btn' + (sel === a ? ' sel' : ''), () => { sel = a; desenhar(); });
      b.setAttribute('aria-pressed', sel === a);
      $('#arq').append(b);
    });
    ['Documentos', 'Imagens', 'Músicas'].forEach(p => $('#pas').append(botao('📁 ' + p, 'btn', () => guardar(p))));
  };
  const guardar = p => {
    if (!sel) { msg('Primeiro clique em um arquivo.', false); return; }
    if (sel[1] === p) {
      restam = restam.filter(a => a !== sel); sel = null; setGols(gols + 1);
      if (!restam.length) { msg('Gol! Tudo guardado!', true); setTimeout(f4, 700); return; }
      desenhar(); msg('Gol! Arquivo na pasta certa.', true);
    } else msg(`Essa não é a pasta certa para ${sel[0]}. Veja o final do nome do arquivo e tente de novo.`, false);
  };
  desenhar();
}

/* Jogada 4: segurança na internet */
const quiz = [
  { p: 'Chegou uma mensagem: “Você ganhou uma camisa! Clique no link e digite sua senha.” O que fazer?',
    o: ['Clicar e digitar a senha', 'Não clicar e mostrar a um adulto', 'Mandar o link para os amigos'], c: 1,
    e: 'Mensagens assim podem ser golpe. Nunca digite senha em links estranhos.' },
  { p: 'Qual destas senhas é a mais segura?',
    o: ['12345', 'meunome', 'Cr4que!7Gols'], c: 2,
    e: 'Senhas fortes misturam letras, números e símbolos.' },
  { p: 'Alguém desconhecido pede seu endereço em um jogo online. O que fazer?',
    o: ['Responder com o endereço', 'Não responder e avisar um adulto', 'Dar só o nome da rua'], c: 1,
    e: 'Dados pessoais não são para estranhos, nem pela metade.' }
];
function f4(){
  setFase(4); msg('', true);
  let i = 0;
  const mostrar = () => {
    const q = quiz[i];
    msg('', true);
    tela(`<h2>Jogada 4: Internet com segurança</h2>
    <p class="prog">Pergunta ${i + 1} de ${quiz.length}</p>
    <p class="pergunta">${q.p}</p><div class="lista" id="ops"></div>`);
    q.o.forEach((t, k) => $('#ops').append(botao(t, 'btn', () => responder(k))));
  };
  const responder = k => {
    const q = quiz[i];
    if (k === q.c) { setGols(gols + 1); msg('Gol! ' + q.e, true); }
    else msg('Não foi dessa vez. ' + q.e, false);
    document.querySelectorAll('#ops button').forEach(x => x.disabled = true);
    const prox = botao(i + 1 < quiz.length ? 'Próxima pergunta' : 'Ver o placar final', 'btn', () => { i++; if (i < quiz.length) mostrar(); else fim(); });
    $('#ops').append(prox); prox.focus();
  };
  mostrar();
}

function fim(){
  msg('', true);
  const frase = gols >= TOTAL ? 'Craque da partida!' :
    gols >= TOTAL * 0.6 ? 'Ótima partida! Jogue de novo para marcar mais gols.' :
    'Bom treino! Jogue de novo para melhorar o seu placar.';
  tela(`<h2>Fim de jogo!</h2>
  <p class="placar-final">Você fez ${gols} de ${TOTAL} gols.</p>
  <p>${frase}</p>
  <button class="btn" id="de-novo">Jogar de novo</button>`);
  $('#de-novo').onclick = inicio;
}

inicio();
</script>
</body>
</html>
